services:
  postgresqldb:
    image: postgres:latest
    container_name: postgresqldb
    environment:
      - POSTGRES_DB=EducationPortalDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgresqldbvolume:/var/lib/postgresql
    networks:
      - educationportal_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@zo.zo
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    networks:
      - educationportal_network
    restart: unless-stopped

  educationportalwebapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educationportalwebapp
    depends_on:
      - postgresqldb
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./keys:/keys
    networks:
      - educationportal_network
    restart: unless-stopped

volumes:
  postgresqldbvolume:


networks:
  educationportal_network:
    driver: bridge
