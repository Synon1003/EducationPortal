name: Education Portal CI

on:
  workflow_dispatch: 
  push:
    branches: [ "dev", "feature_cicd" ]

env:
  AZURE_WEBAPP_NAME: EducationPortalApp
  AZURE_WEBAPP_PACKAGE_PATH: "./EducationPortal.Web/publish"
  DOTNET_VERSION: "8.0.x"
  SOLUTION_PATH: "./educationportal.sln"
  APP_PROJECT_PATH: "EducationPortal.Web"
  PUBLISH_DIR: "./publish"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

    - name: Test
      run: dotnet test ${{ env.SOLUTION_PATH }} --no-restore --no-build --configuration Release --verbosity normal
      
    - name: Publish
      run: dotnet publish ${{ env.APP_PROJECT_PATH }} --no-restore --no-build --configuration Release --property:PublishDir=${{ env.PUBLISH_DIR }}

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Download artifacts from build job
        uses: actions/download-artifact@v8
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
